name: parity-check
run-name: Compare statements with the original game
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ["main"]
jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fetch the original game at the pinned commit
        run: |
          git clone --quiet https://github.com/emilyriehl/ReintroductionToProofs upstream
          git -C upstream checkout --quiet "$(cat UPSTREAM_COMMIT)"
      - name: Compare
        run: python3 scripts/check_parity.py upstream .
